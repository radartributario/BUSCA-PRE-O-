name: PC Hunter 24h

on:
  workflow_dispatch:       # manual por enquanto — schedule desativado para evitar falsos positivos
  # schedule:
  #   - cron: '*/30 * * * *'  # reative após validar scrape de página do produto

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Caçar promoções
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          INTERVAL_MIN: 0
        run: node pc-hunter/tracker.js
